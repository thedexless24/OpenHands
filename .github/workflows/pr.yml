name: pr

# Lints PR titles (Conventional Commits) and applies `type:` labels that drive
# release notes + the version release-please derives (OpenHands/release-actions).
#
# pull_request_target (not pull_request) so it also runs on fork PRs, where the
# label step needs a writable token. Safe ONLY because the reusable workflow
# never checks out PR code (reads the title from the payload) and this caller
# does NOT pass `secrets: inherit` (so the App token stays out of scope). Don't
# add a checkout step or `secrets: inherit`.
on:
  pull_request_target:
    # synchronize: re-run on each push so the check stays green on release-please's
    # force-pushed release PR.
    types: [opened, edited, reopened, synchronize]

# Burst control (kanban t_cacbe734, 2026-09-20): a superseded push on the same ref
# cancels its queued predecessor instead of stacking it behind the shared runner lane.
#
# Grouped by PR number (kanban t_ba26f42c, 2026-10-04): this caller runs on
# pull_request_target, where github.ref resolves to the BASE branch (main). Keying the
# group on github.ref alone therefore put every open PR into one group — a burst of
# dependabot PRs cancelled each other's title check instead of only superseding their own
# ref (OpenHands#15: three PRs opened 05:18:36-49Z on 2026-10-04, the newest run cancelled
# the other two, so this label step never ran and no `type:` label was applied). The PR
# number scopes cancellation to a new push on the same PR, which is what burst control
# is for; the github.ref fallback keeps any non-PR caller of this file grouped as before.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    permissions:
      pull-requests: write
    uses: OpenHands/release-actions/.github/workflows/pr-title.yml@main
